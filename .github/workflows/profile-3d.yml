name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

concurrency:
  group: profile-3d-contributions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D contribution images
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push generated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -s profile-3d-contrib/profile-night-view.svg ]; then
            echo "::error::Expected 3D contribution SVG was not generated."
            find profile-3d-contrib -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "3D contribution images are already up to date."
            exit 0
          fi

          git commit -m "chore: update 3D contribution graph"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "3D contribution images pushed successfully."
              exit 0
            fi

            echo "Push rejected; rebasing onto latest main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main
          done

          echo "Could not push 3D contribution images after 3 attempts."
          exit 1
