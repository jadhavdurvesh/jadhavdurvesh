name: Update language stack # builds SVG and PNG profile assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_language_stack.py"
      - ".github/workflows/language-stack.yml"

permissions:
  contents: write

concurrency:
  group: language-stack
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install SVG renderer
        run: pip install cairosvg
      - name: Generate language stack SVG and PNG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: jadhavdurvesh
        run: python scripts/generate_language_stack.py
      - name: Commit and push generated SVG (with retry)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-stack-v2.svg assets/language-stack-v2.png
          git rm -f assets/language-stack-custom.svg 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Language stack is already up to date."
            exit 0
          fi

          git commit -m "chore: update profile language stack"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Generated language stack SVG and PNG pushed successfully."
              exit 0
            fi

            echo "Push rejected; rebasing onto latest main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main
          done

          echo "Could not push generated SVG after 3 attempts."
          exit 1
